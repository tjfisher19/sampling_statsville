:root{
  --bg:#e7e4f4; --surface:#fbfaff; --ink:#1f1d3a; --muted:#5d5a7c; --line:#1f1d3a; --gold:#f2b632;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#13121f; --surface:#1f1d36; --ink:#ecebf8; --muted:#a8a5c8; --line:#ecebf8; }
}
:root[data-theme="dark"]{ --bg:#13121f; --surface:#1f1d36; --ink:#ecebf8; --muted:#a8a5c8; --line:#ecebf8; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;}
[hidden]{display:none !important}

.wrap{max-width:1320px; margin:0 auto; padding:16px 18px 22px; display:flex; flex-direction:column; align-items:center; gap:18px;}
.stage{position:relative; width:min(100%, calc((100dvh - 190px) * 16 / 9)); min-width:min(100%,300px); aspect-ratio:16/9; background:#0e0d1a;
  container-type:inline-size; overflow:hidden; outline:3px solid var(--line); box-shadow:7px 7px 0 3px var(--line); user-select:none; -webkit-user-select:none;}
#cv{display:block; width:100%; height:100%;}

/* Dialogue box */
.dialog{position:absolute; left:3%; right:3%; bottom:3.5%; height:23%; display:flex; gap:2cqw; align-items:stretch;
  padding:1.3cqw 1.8cqw; background:#1d1b3a; color:#fff; border:.42cqw solid #fff; outline:.42cqw solid #1d1b3a;
  box-shadow:inset 0 0 0 .3cqw #3b3772;}
.dialog.pop{animation:dlgIn .28s steps(4) both}
@keyframes dlgIn{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
.portrait{height:100%; aspect-ratio:1; image-rendering:pixelated; border:.3cqw solid #fff; flex:none;}
.dlg-body{position:relative; flex:1; min-width:0; overflow:hidden}
.speaker{font-family:"Press Start 2P","Courier New",monospace; font-size:1.2cqw; color:#ffd84a; margin:0 0 .9cqw; letter-spacing:.02em}
.line{font-size:2.3cqw; line-height:1.38; margin:0}
.line .rest{visibility:hidden}
.num{font-family:"Press Start 2P","Courier New",monospace; font-size:.8em; letter-spacing:0; margin:0 .08em}
.line .num,.start .num{color:#ffd84a}
.num .dot{margin:0 -.3em}
.mu-g{font-family:"Times New Roman",Times,Georgia,serif; font-style:italic; font-size:1.15em; line-height:1}
.caret{position:absolute; right:0; bottom:0; font-size:1.3cqw; color:#ffd84a; animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* Quest popup */
.quest{position:absolute; top:7%; left:50%; width:56%; transform:translateX(-50%); background:#fff8dc; color:#2a1f3d;
  border:.45cqw solid #2a1f3d; box-shadow:.8cqw .8cqw 0 #2a1f3d; padding:1.5cqw 2.2cqw 1.3cqw; text-align:center;}
.quest.pop{animation:questIn .4s steps(5) both}
@keyframes questIn{from{transform:translate(-50%,-60%);opacity:0}to{transform:translateX(-50%);opacity:1}}
.quest h2{font-family:"Press Start 2P","Courier New",monospace; font-weight:400; font-size:1.7cqw; color:#d8392e; margin:0 0 1.1cqw}
.quest p{font-size:2.15cqw; line-height:1.35; margin:0 0 .9cqw}
.quest .mu{font-size:2.4cqw; font-weight:600; margin:0; letter-spacing:.06em}

/* Start + end overlays */
.start{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.2cqw; background:rgba(14,13,26,.42)}
.big-btn{font-family:"Press Start 2P","Courier New",monospace; font-size:2.3cqw; color:#1d1b3a; background:#ffd84a; border:.45cqw solid #1d1b3a;
  box-shadow:.7cqw .7cqw 0 #1d1b3a; padding:1.6cqw 2.6cqw; cursor:pointer;}
.big-btn:active{transform:translate(.35cqw,.35cqw); box-shadow:.35cqw .35cqw 0 #1d1b3a}
.big-btn .blink{animation:blink 1s steps(2) infinite}
.start p{margin:0; color:#fff; font-size:1.7cqw; text-shadow:.2cqw .2cqw 0 #1d1b3a}
.endbtns{position:absolute; left:50%; bottom:29%; transform:translateX(-50%); display:flex; gap:1.6cqw; flex-wrap:wrap; justify-content:center; width:90%}
.endbtns .big-btn{font-size:1.5cqw; padding:1.1cqw 1.8cqw; text-decoration:none; display:inline-block}
.endbtns .alt{background:#fff8dc}

/* Controls */
.bar{width:min(100%, calc((100dvh - 190px) * 16 / 9)); min-width:min(100%,300px); display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.btn,.chap{font:inherit; color:var(--ink); background:var(--surface); border:2px solid var(--line); box-shadow:3px 3px 0 var(--line); cursor:pointer}
.btn{width:42px; height:42px; display:grid; place-items:center; padding:0}
.btn svg{width:20px; height:20px; fill:currentColor}
.btn:active,.chap:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line)}
#seek{flex:1 1 180px; min-width:140px; accent-color:#e8443a; height:28px}
.time{font-family:"Press Start 2P","Courier New",monospace; font-size:12px; min-width:128px; text-align:center}
.chapters{width:min(100%, calc((100dvh - 190px) * 16 / 9)); min-width:min(100%,300px); display:flex; flex-wrap:wrap; gap:8px; margin-top:-4px}
.chap{font-size:14px; padding:5px 10px; box-shadow:2px 2px 0 var(--line)}
.chap[aria-current="true"]{background:var(--gold); color:#1d1b3a}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e8443a; outline-offset:3px}

.wrap:fullscreen{max-width:none; width:100%; height:100%; justify-content:center; background:#0e0d1a; --surface:#1f1d36; --ink:#ecebf8; --line:#ecebf8; padding:12px}
.wrap:fullscreen .stage,.wrap:fullscreen .bar,.wrap:fullscreen .chapters{width:min(100%, calc((100vh - 140px) * 16 / 9))}
.wrap:fullscreen .chapters{display:none}
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <div class="stage" id="stage">
    <canvas id="cv" width="1920" height="1080" role="img" aria-label="Animated introduction to the town of Statsville"></canvas>

    <div class="quest" id="quest" hidden aria-live="polite">
      <h2 id="questHead"></h2>
      <p id="questBody"></p>
      <p class="mu" id="questFoot"></p>
    </div>

    <div class="dialog" id="dialog" hidden>
      <canvas class="portrait" id="portrait" width="12" height="12" aria-hidden="true"></canvas>
      <div class="dlg-body" id="dlgBody">
        <p class="speaker" id="speaker"></p>
        <p class="line" id="line" aria-live="polite"><span id="shown"></span><span class="rest" id="rest"></span></p>
        <span class="caret" id="caret" aria-hidden="true">▼</span>
      </div>
    </div>

    <div class="start" id="start">
      <button class="big-btn" id="startBtn"><span class="blink">▶</span> <span id="startLabel">Press start</span></button>
      <p id="startHint"></p>
    </div>

    <div class="endbtns" id="endBtns" hidden>
      <button class="big-btn" id="replayBtn">Replay</button>
    </div>
  </div>

  <div class="bar" role="toolbar" aria-label="Playback">
    <button class="btn" id="playBtn" aria-label="Play">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" id="icoPlay"><path d="M4 2h2v12H4zM6 3h2v10H6zM8 4h2v8H8zM10 6h2v4h-2zM12 7h1v2h-1z"/></svg>
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" id="icoPause" hidden><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>
    </button>
    <button class="btn" id="restartBtn" aria-label="Restart">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 2h2v12H2zM12 2h2v12h-2zM10 4h2v8h-2zM8 6h2v4H8zM6 7h2v2H6z"/></svg>
    </button>
    <input type="range" id="seek" min="0" max="1800" step="1" value="0" aria-label="Seek">
    <span class="time" id="time">0:00</span>
    <button class="btn" id="soundBtn" aria-label="Sound on" aria-pressed="true">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M1 6h3v4H1zM4 5h2v6H4zM6 3h2v10H6z"/><path id="waves" d="M10 6h1v4h-1zM12 4h1v8h-1zM14 2h1v12h-1z"/><path id="mute" hidden d="M10 5h1v1h-1zM11 6h1v1h-1zM12 7h1v2h-1zM13 9h1v1h-1zM14 10h1v1h-1zM14 5h1v1h-1zM13 6h1v1h-1zM11 9h1v1h-1zM10 10h1v1h-1z"/></svg>
    </button>
    <button class="btn" id="fsBtn" aria-label="Fullscreen">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z"/></svg>
    </button>
  </div>
  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
</main>

<script>
(() => {

/* ---------------- On-screen text ---------------- */

const SEG=SEGMENTS[SEG_ID];
let acc=0; SEG.clips.forEach(c=>{ c.hold=c.hold||0; c.start=acc; c.len=c.b-c.a+c.hold; acc+=c.len; });
const DUR=Math.round(acc*100)/100;
const CUTS=SEG.clips.slice(1).map(c=>c.start);
const gT=(ci,x)=>SEG.clips[ci].start+(x-SEG.clips[ci].a);
const CUES=SEG.cues.map(([ci,a,b,who,text])=>({t0:gT(ci,a),t1:b>=999?1e9:gT(ci,b),who,text}));

const CPS = 22;                                   // typewriter speed, characters per second
function locate(x){ let c=SEG.clips[0]; for(const k of SEG.clips) if(x>=k.start) c=k; return {c, lt:Math.min(c.b-1e-3, c.a+(x-c.start))}; }   // hold just before b so the scene stays in its own phase

/* ---------------- Utils ---------------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const eout=u=>1-Math.pow(1-u,3);
const eback=u=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------- Canvas ---------------- */
const W=320, H=180, S=6;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let cam={x:0,y:0,z:1};
function setCam(x=0,y=0,z=1){cam={x,y,z};ctx.setTransform(z*S,0,0,z*S,-x*z*S,-y*z*S);}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function disc(cx,cy,r,c){for(let dy=-r;dy<=r;dy++){const hw=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy)));R(cx-hw,cy+dy,hw*2+1,1,c);}}
function ellipse(cx,cy,rx,ry,c){for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));R(cx-hw,cy+dy,hw*2+1,1,c);}}
function box(x,y,w,h,c,t=1){R(x,y,w,t,c);R(x,y+h-t,w,t,c);R(x,y,t,h,c);R(x+w-t,y,t,h,c);}
function panel(x,y,w,h,bg,bd){R(x+1,y,w-2,h,bd);R(x,y+1,w,h-2,bd);R(x+1,y+1,w-2,h-2,bg);}

const FONTS={
  title:'"Press Start 2P", "Courier New", monospace',
  ui:'"Pixelify Sans", "Trebuchet MS", sans-serif'
};
// Digits are drawn in the blocky Press Start 2P face so every number reads clearly.
const NUMK=0.8, NUM_RE=/(\d+(?:\.\d+)?)/;
function textRuns(str,fs,bold,kind){
  const base=`${bold?'600 ':''}${Math.round(fs)}px ${FONTS[kind]||FONTS.ui}`;
  if(kind==='title'||!/\d/.test(str)) return [{s:str,num:false,font:base}];
  const nf=`${Math.round(fs*NUMK)}px ${FONTS.title}`, out=[];
  str.split(NUM_RE).filter(Boolean).forEach(p=>{
    if(!/^\d/.test(p)){ out.push({s:p,num:false,font:base}); return; }
    // keep decimals like 66.9 tight: the pixel font's full-width dot is squeezed
    p.split(/(\.)/).filter(Boolean).forEach(q=>out.push({s:q,num:true,dot:q==='.',font:nf}));
  });
  return out;
}
function measureRuns(runs){ let w=0; runs.forEach((r,i)=>{ ctx.font=r.font; const fs=parseFloat(r.font.replace(/^600 /,''));
    const prevNum=i>0&&runs[i-1].num, nextNum=i<runs.length-1&&runs[i+1].num, mw=ctx.measureText(r.s).width;
    if(r.dot){ r.pl=-mw*0.3; r.pr=0; r.w=mw*0.4; }
    else { r.pl=(r.num&&i>0&&!prevNum)?fs*0.14:0; r.pr=(r.num&&i<runs.length-1&&!nextNum)?fs*0.08:0; r.w=mw+r.pl+r.pr; }
    w+=r.w; }); return w; }
function drawRuns(runs,x,y,op){ for(const r of runs){ ctx.font=r.font; op(r,x+(r.pl||0),y); x+=r.w; } }
function T(str,x,y,o={}){
  const size=o.size||7, kind=o.kind||'ui', z=cam.z*S, fs=size*z;
  const sx=(x-cam.x)*z, sy=(y-cam.y)*z;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  if(o.alpha!=null) ctx.globalAlpha*=clamp(o.alpha);
  ctx.textAlign='left'; ctx.textBaseline=o.base||'alphabetic'; ctx.lineJoin='round';
  const runs=textRuns(String(str),fs,o.bold,kind), tw=measureRuns(runs), al=o.align||'left';
  const x0=al==='center'?sx-tw/2:al==='right'?sx-tw:sx;
  const ow=o.outlineW||Math.max(S,fs*0.2);
  if(o.shadow){ const d=o.shadowD||Math.max(S,Math.round(fs*0.09));
    if(o.outline){ctx.lineWidth=ow; ctx.strokeStyle=o.shadow; drawRuns(runs,x0+d,sy+d,(r,a,b)=>ctx.strokeText(r.s,a,b));}
    ctx.fillStyle=o.shadow; drawRuns(runs,x0+d,sy+d,(r,a,b)=>ctx.fillText(r.s,a,b)); }
  if(o.outline){ ctx.lineWidth=ow; ctx.strokeStyle=o.outline; drawRuns(runs,x0,sy,(r,a,b)=>ctx.strokeText(r.s,a,b)); }
  if(o.glow){ ctx.shadowColor=o.glow; ctx.shadowBlur=o.glowB||fs*0.6; }
  drawRuns(runs,x0,sy,(r,a,b)=>{ ctx.fillStyle=(r.num&&o.numColor)||o.color||'#fff'; ctx.fillText(r.s,a,b); });
  ctx.restore();
}
/* A label box with a stepped pointer, drawn in device space */
function tag(str,wx,wy,a,o={}){
  if(a<=0) return;
  const z=cam.z*S, px=(wx-cam.x)*z, py=(wy-cam.y)*z, fs=(o.size||6)*S;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  const runs=textRuns(str,fs,false,'ui'), tw=measureRuns(runs);
  const bw=Math.ceil((tw+fs*1.2)/S)*S, bh=Math.ceil((fs*1.7)/S)*S;
  const lift=(o.lift??10)*S, k=eback(clamp(a));

  const bd=o.border||'#ffffff', bg=o.bg||'#1d1b3a';

  ctx.fillStyle=bg; ctx.fillRect(bx,by,bw,bh);

  ctx.fillStyle=bd; ctx.fillRect(cx-S,by+bh+S,3*S,S); ctx.fillRect(cx,by+bh+2*S,S,S);
  for(let yy=by+bh+4*S; yy<py-S; yy+=2*S) ctx.fillRect(cx,yy,S,S);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  drawRuns(runs,bx+(bw-tw)/2,by+bh/2+fs*0.05,(r,x,y)=>{ ctx.fillStyle=r.num?(o.numColor||'#ffd84a'):(o.color||'#ffffff'); ctx.fillText(r.s,x,y); });
  ctx.restore();
}

/* ---------------- Sprites ---------------- */
function makeSprite(rows,pal){
  const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=rows[y][x];if(k!=='.'&&pal[k]){g.fillStyle=pal[k];g.fillRect(x,y,1,1);}}
  return c;
}
const BODY_M=["..HHH..",".HHHHH.",".HSSSH.",".SESES.","..SSS..",".BBBBB.","SBBBBBS",".BBBBB."];
const BODY_F=["..HHH..",".HHHHH.","HHSSSHH","HSESESH","HHSSSHH",".BBBBB.","SBBBBBS","BBBBBBB"];
const LEGS=[[".LL.LL.",".FF.FF."],["..LLL..","..F.F.."]];
const TINY=[[".H.",".S.","BBB",".B.","L.L"],[".H.",".S.","BBB",".B.",".L."]];

function mountain(cx,py,by,slope,cl,cd,snow){
  const hw=Math.ceil((by-py)/slope);
  for(let x=cx-hw;x<=cx+hw;x++){
    const yy=Math.round((py+Math.abs(x-cx)*slope)/2)*2;
    if(yy>=by) continue;
    R(x,yy,1,by-yy,x<cx?cl:cd);
    if(snow&&yy<py+7){const d=py+7-yy+((x&1)?1:0);R(x,yy,1,d,x<cx?snow:'#d9d4f0');}
  }
}

function mapPos(p,lt){
  const s=p.street,u=0.5+0.5*Math.sin(p.ph+lt*p.spd);
  if(s<10) return [Math.round(G2.x+1+u*97),G2.y+s*11-2];
  return [G2.x+(s-10)*11,Math.round(G2.y+1+u*97)-2];
}
function mapCount(lt){let n=0;for(const p of P) if(lt>=p.mapAt) n++;return n;}
function roadRect(g){ return g<10?[G2.x,G2.y+g*11,102,3]:[G2.x+(g-10)*11,G2.y,3,102]; }
function roadGlow(g,c,t=1){ const [x,y,w,h]=roadRect(g); box(x-t,y-t,w+2*t,h+2*t,c,t); }
function roadFill(g,c){ const [x,y,w,h]=roadRect(g); R(x,y,w,h,c); }
function roadLetter(g,o){ const ch=String.fromCharCode(65+g);
  if(g<10) T(ch,G2.x-3,G2.y+g*11+4.5,{size:5,kind:'title',align:'right',...o});

      R(Math.round(f.x+Math.cos(th)*d),Math.round(f.y+Math.sin(th)*d+a*a*10),2,2,f.c);
      R(Math.round(f.x+Math.cos(th)*d*0.55),Math.round(f.y+Math.sin(th)*d*0.55+a*a*8),1,1,'#ffffff');}
    ctx.globalAlpha=1; });
  [[20,82],[80,74],[140,86],[200,72],[260,84],[315,76]].forEach(([x,p])=>mountain(x,p,114,0.9,'#2e2858','#27224d',null));
  SKY_HOUSES.forEach(([x,y,w],i)=>{R(x,y,w,H-y,'#1a1633');R(x+2,y-3,w-4,3,'#1a1633');for(let k=0;k<Math.floor(w/6);k++) if((i+k)%3!==0) R(x+3+k*6,y+5,2,3,'#ffd84a');});
  R(120,104,80,H-104,'#1a1633'); panel(128,92,64,11,'#1a1633','#ff5fa2');
  T('MEAN DINER',160,99.6,{size:4.5,kind:'title',align:'center',color:'#ffe3f0',glow:'#ff5fa2',glowB:18});
  for(let k=0;k<5;k++) R(126+k*14,110,8,6,'#ffcf7a');

  const qa=inv(0.2,0.6,lt);
  if(qa>0) T(TX.questStart,160,32+Math.sin(ft*4)*1.2,{size:Math.max(0.5,14*eback(qa)),kind:'title',align:'center',color:'#ffd84a',outline:'#2a1f3d',outlineW:S*2,shadow:'#b4471f',shadowD:S*1.5});

  for(let i=0;i<4;i++){ const a=inv(1.0+i*0.25,1.4+i*0.25,lt); drawSkillCard(i,16+i*74,Math.round(44+(1-eback(a))*20),a); }
}

function drawSkillCard(i,x,y,a){
  if(a<=0) return;
  const cx=x+33, cy=y+16;
  ctx.globalAlpha=clamp(a*2); panel(x,y,66,43,'#2a2750','#e9e6ff');
    if(i===0){disc(cx-9,cy+1,4,'#ff5fa2');disc(cx,cy-3,4,'#ffd84a');disc(cx+9,cy+1,4,'#5cb8ff');R(cx-11,cy-2,2,1,'#fff');R(cx-2,cy-6,2,1,'#fff');R(cx+7,cy-2,2,1,'#fff');}
    if(i===1){d10(cx-7,cy,13,17,'',0,false); for(let k=0;k<3;k++){R(cx+7,cy-8+k*7,4,4,'#ffd84a'); if(k<2) R(cx+8,cy-3+k*7,2,2,'#8c86b8');}}
    if(i===2){for(let r=0;r<5;r++)R(cx-13,cy-8+r*4,26,3,STRATA_COL[r]); box(cx-15,cy-3,30,6,'#ffffff');}
    if(i===3){R(cx-16,cy+5,32,2,'#8f98ab');for(let k=0;k<3;k++){const hx=cx-13+k*9;R(hx,cy-2,7,2,['#e0584a','#4f8fd0','#f0a13c'][k]);R(hx,cy,7,5,'#f6ecd4');} box(cx-17,cy-5,34,14,'#ffd84a');}
    ctx.globalAlpha=1;
    T(TX.cards[i],cx,y+36,{size:6,align:'center',color:'#ffffff',alpha:clamp(a*2)});
}

function checker(){ R(0,0,W,H,'#232149'); for(let j=0;j<12;j++) for(let i=0;i<20;i++) if((i+j)&1) R(i*16,j*16,16,16,'#28265a'); }

/* ---------------- Story ending: the four skills ---------------- */
const SKILL_POP=[3.6,4.3,4.9,5.6];
function sceneSkills(lt){
  setCam(0,0); checker();
  const ha=eout(inv(0,0.4,lt)); R(0,0,W,17,'rgba(14,13,26,.6)'); R(0,17,W,1,'#3b3772');
  T(TX.skillsHead,160,12-(1-ha)*14,{size:7,kind:'title',align:'center',color:'#ffd84a',shadow:'#6b3a00',alpha:ha});
  SKILL_POP.forEach((t0,i)=>{ const a=inv(t0,t0+0.4,lt), x=16+i*74, y=Math.round(52+(1-eback(a))*20);
    T('Skill '+(i+1),x+33,y-5,{size:5,kind:'title',align:'center',color:'#ffd84a',alpha:clamp(a*2)});
    drawSkillCard(i,x,y,a); });
}

/* ---------------- Title card at the start of each skill video ---------------- */
function sceneTitle(lt,k){
  setCam(0,0); checker();
  const a1=inv(0.1,0.7,lt);
  T('SKILL '+(k+1),160,48-(1-eback(a1))*40,{size:16,kind:'title',align:'center',color:'#ffd84a',outline:'#2a1f3d',outlineW:S*2.2,shadow:'#b4471f',shadowD:S*1.6,alpha:clamp(a1*3)});
  T(TX.titleNames[k],160,68,{size:8,kind:'title',align:'center',color:'#ffffff',shadow:'#1d1b3a',alpha:inv(0.6,1.0,lt)});
  const a2=inv(1.0,1.4,lt), z=1.5, dy=(1-eback(a2))*12;
  setCam(160-160/z,117.5-(126+dy)/z,z); drawSkillCard(k,127,96,a2); setCam(0,0);
}

/* ---------------- Transitions ---------------- */
function iris(){
  let r=1;
  for(const c of CUTS) if(t>c-0.4&&t<c+0.4) r=Math.abs(t-c)/0.4;
  if(started&&t<0.45) r=Math.min(r,t/0.45);
  if(r>=1) return;
  const rr=eio(r)*1250;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#0e0d1a'; ctx.beginPath(); ctx.rect(0,0,cv.width,cv.height);
  if(rr>1) ctx.arc(960,420,rr,0,Math.PI*2,true);
  ctx.fill('evenodd');
}

/* ---------------- Audio (all synthesized) ---------------- */
const AU={ctx:null,master:null,on:true,timer:null,next:0,step:0,
  init(){ if(this.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=this.on?0.5:0; this.master.connect(this.ctx.destination); },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  noteAt(f,t0,d,type,v,f2){ if(!this.ctx) return; const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+d+0.03); },
  tone(f,d,type='square',v=0.04,delay=0,f2=null){ if(!this.ctx||!this.on) return; this.noteAt(f,this.ctx.currentTime+delay,d,type,v,f2); },
  blip(){ this.tone(740+Math.random()*120,0.035,'square',0.014); },
  pop(i=0){ this.tone(420+i*40,0.07,'square',0.025,0,900+i*60); },
  ding(k=0){ const f=[784,880,988,1047,1175,1319,1397,1568,1760,1976][k%10]; this.tone(f,0.14,'triangle',0.09); this.tone(f*1.5,0.16,'triangle',0.04,0.05); },
  tick(){ this.tone(1200,0.025,'square',0.016); },
  beep(){ this.tone(988,0.08,'square',0.03,0,1480); },
  thud(i){ this.tone(220+i*30,0.08,'square',0.03,0,110); },
  jingle(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.13,'square',0.045,i*0.08)); },
  fanfare(){ [[523,0],[659,0.12],[784,0.24],[1047,0.36],[784,0.52],[1047,0.64]].forEach(([f,d])=>{this.tone(f,0.16,'square',0.05,d);this.tone(f/2,0.18,'triangle',0.07,d);}); },
  boom(){ this.tone(160,0.35,'sawtooth',0.03,0,40); this.tone(1800,0.2,'square',0.01,0.05,600); },
  startMusic(){ if(!this.ctx||!this.on||this.timer) return; this.next=this.ctx.currentTime+0.08; this.timer=setInterval(()=>this.sched(),30); },
  stopMusic(){ clearInterval(this.timer); this.timer=null; },
  sched(){
    const PROG=[[130.81,[523.25,659.25,783.99]],[110,[440,523.25,659.25]],[87.31,[349.23,440,523.25]],[98,[392,493.88,587.33]]];
    const ARP=[[0,1,2,1],[0,2,1,2],[2,1,0,1],[0,1,2,2]];
    while(this.next<this.ctx.currentTime+0.15){
      const s=this.step,[bass,ch]=PROG[Math.floor(s/8)%4],pos=s%8,blk=Math.floor(s/64)%4;
      if(pos%2===0) this.noteAt(pos===4?bass*1.5:bass,this.next,0.19,'triangle',0.07);
      this.noteAt(ch[ARP[blk][pos%4]]*(pos>=4?2:1)/2,this.next,0.11,'square',0.012);
      if(blk%2===1&&(pos===0||pos===3)) this.noteAt(ch[pos===0?2:1]*2,this.next,0.3,'triangle',0.02);
      this.next+=0.2; this.step++; } },
  setOn(v){ this.on=v; if(this.master) this.master.gain.value=v?0.5:0; if(!v) this.stopMusic(); else if(playing) this.startMusic(); }
};

const SEV=[], ev=(s,t,f)=>SEV.push({s,t,f});
for(let i=0;i<10;i++) ev('valley',0.5+i*0.08,()=>AU.thud(i));
[7.0,9.0,15.8].forEach(x=>ev('valley',x,()=>AU.beep()));
[10.6,11.6,15.8,21.8].forEach(x=>ev('map',x,()=>AU.beep()));
ev('diner',15.5,()=>AU.jingle());
for(let i=0;i<8;i++) ev('lineup',7.2+i*0.35,()=>AU.pop(i));
srsIds.forEach((id,k)=>ev('lineup',srsAt[id],()=>AU.ding(k)));
ev('lineup',DIE[1],()=>AU.jingle());
sysIds.forEach((id,k)=>ev('lineup',sysAt[id],()=>AU.ding(k)));
Object.values(strAt).sort((a,b)=>a-b).forEach((x,k)=>ev('lineup',x,()=>AU.ding(k)));
for(let q=0;q<20;q++) ev('cluster',1.5+q*0.2,()=>AU.tone(392+q*25,0.06,'square',0.018));
CL_PICK.forEach(c=>{ ev('cluster',c.at,()=>{AU.ding(6);AU.ding(9);}); for(let k=0;k<5;k++) ev('cluster',c.at+1.0+k*0.12,()=>AU.pop(k)); });
SKILL_POP.forEach((x,i)=>ev('skills',x,()=>AU.pop(i*2)));
ev('title',0.35,()=>AU.jingle());
ev('finale',0.3,()=>AU.fanfare());
for(let rep=0;rep<3;rep++) FW.forEach(f=>ev('finale',f.t+rep*6+0.35,()=>AU.boom()));
const EVENTS=[];
SEG.clips.forEach(c=>SEV.forEach(e=>{ if(e.s===c.s&&e.t>c.a&&e.t<=c.b) EVENTS.push({t:c.start+(e.t-c.a),f:e.f}); }));
// Counters that tick whenever their value changes (scene time)
const TICKERS={
  lineup:[lt=>(lt>=14.5&&lt<LU.C)?censusN(lt):-1, lt=>(lt>=DIE[0]&&lt<DIE[1])?dieSteps(lt):-1, lt=>sysCursor(lt)],
  cluster:[lt=>rouletteIndex(lt)]
};

/* ---------------- State ---------------- */
let t=0, prevT=0, playing=false, started=false, ended=false, endAt=0, last=null, lastPop=0;
const $=id=>document.getElementById(id);
const dlg=$('dialog'), dlgBody=$('dlgBody'), line=$('line'), shown=$('shown'), rest=$('rest'), speaker=$('speaker'), caret=$('caret'), portrait=$('portrait');
const pctx=portrait.getContext('2d'); pctx.imageSmoothingEnabled=false;
const quest=$('quest'), seek=$('seek'), timeEl=$('time'), playBtn=$('playBtn');
let lastKey='', lastCue=-1, lastN=0, questOn=false, seeking=false;

const ESC={'&':'&amp;','<':'&lt;','>':'&gt;'};
function html(str){return str.replace(/[&<>]/g,c=>ESC[c]).replace(/\d+(?:\.\d+)?/g,m=>'<span class="num">'+m.replace('.','<span class="dot">.</span>')+'</span>').replace(/μ/g,'<span class="mu-g">μ</span>');}

function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// Shrink the dialogue text a little if a line would overflow the box
function fitLine(){ line.style.fontSize=''; let f=1;
  for(let i=0;i<8&&dlgBody.scrollHeight>dlgBody.clientHeight+1;i++){ f-=0.06; line.style.fontSize=(2.3*f)+'cqw'; } }

function updateDialog(){
  const idx=CUES.findIndex(c=>t>=c.t0&&t<c.t1);
  if(idx<0){ if(!dlg.hidden){dlg.hidden=true;} lastCue=-1; lastKey=''; return; }
  const c=CUES[idx], chars=[...c.text];
  const n=Math.min(chars.length,Math.floor((t-c.t0)*CPS));
  const key=idx+'|'+n;
  if(dlg.hidden){ dlg.hidden=false; dlg.classList.remove('pop'); void dlg.offsetWidth; dlg.classList.add('pop'); }
  if(key===lastKey) return;
  const newCue=idx!==lastCue;
  if(newCue){ const pt=PORTRAITS[c.who]; pctx.clearRect(0,0,12,12); pctx.drawImage(pt.img,0,0); portrait.style.background=pt.bg; lastN=0; speaker.textContent=TX[c.who]; }
  shown.innerHTML=html(chars.slice(0,n).join('')); rest.innerHTML=html(chars.slice(n).join(''));
  if(newCue) fitLine();
  caret.style.visibility=n>=chars.length?'visible':'hidden';
  if(playing&&!newCue&&n>lastN&&(n%2===0)&&chars[n-1]!==' ') AU.blip();
  lastCue=idx; lastN=n; lastKey=key;
}
function updateQuest(){
  const on=t>=QUEST[0]&&t<QUEST[1];
  if(on!==questOn){ questOn=on; quest.hidden=!on; if(on){quest.classList.remove('pop'); void quest.offsetWidth; quest.classList.add('pop');} }
}
function updateChrome(){
  if(!seeking) seek.value=Math.round(t*10);
  timeEl.textContent=fmt(t)+' / '+fmt(DUR);
  $('icoPlay').toggleAttribute('hidden',playing); $('icoPause').toggleAttribute('hidden',!playing);
  playBtn.setAttribute('aria-label',playing?'Pause':'Play');
  const ci=CHAPTERS.reduce((m,c,i)=>t>=c[1]-0.001?i:m,0);
  chapBtns.forEach((b,i)=>b.setAttribute('aria-current',i===ci?'true':'false'));
}

function fireEvents(a,b){
  for(const e of EVENTS) if(e.t>a&&e.t<=b) e.f();
  const A=locate(a), B=locate(b); if(A.c!==B.c) return;
  if(B.c.s==='map'){ const na=mapCount(A.lt), nb=mapCount(B.lt), now=performance.now(); if(nb>na&&now-lastPop>70){AU.pop(nb%5);lastPop=now;} return; }
  for(const f of (TICKERS[B.c.s]||[])){ const ra=f(A.lt), rb=f(B.lt); if(rb>=0&&rb!==ra) AU.tick(); }
}

function render(vt){
  ctx.setTransform(1,0,0,1,0,0);
  const {c,lt}=locate(t);
  if(c.s==='valley') sceneIntro(lt);
  else if(c.s==='map') sceneMap(lt);
  else if(c.s==='diner') sceneDiner(lt);
  else if(c.s==='lineup') sceneLineup(lt);
  else if(c.s==='skills') sceneSkills(lt);
  else if(c.s==='title') sceneTitle(lt,c.k);
  else if(c.s==='cluster') sceneCluster(lt);
  else sceneFinale(lt,c.a+(vt-c.start));
  iris();
}

function frame(now){
  const dt=last==null?0:Math.min(0.1,(now-last)/1000); last=now;
  if(playing){ prevT=t; t=Math.min(DUR,t+dt); fireEvents(prevT,t); if(t>=DUR) finish(); }
  const vt=ended?DUR+(now-endAt)/1000:t;
  render(vt); updateDialog(); updateQuest(); updateChrome();
  requestAnimationFrame(frame);
}

function hideStart(){ if(!started){ started=true; $('start').hidden=true; } }
function play(){
  hideStart(); AU.init(); AU.resume();
  if(t>=DUR-0.01) seekTo(0);
  ended=false; $('endBtns').hidden=true; playing=true; AU.startMusic();
}
function pause(){ playing=false; AU.stopMusic(); }
function toggle(){ playing?pause():play(); }
function finish(){ playing=false; ended=true; endAt=performance.now(); AU.stopMusic(); $('endBtns').hidden=false; }
function seekTo(x){ t=clamp(x,0,DUR); prevT=t; lastKey=''; if(t<DUR){ended=false;$('endBtns').hidden=true;} }

/* ---------------- Controls ---------------- */
$('questHead').textContent=TX.questHead; $('questBody').textContent=TX.questBody; $('questFoot').innerHTML=html(TX.questFoot); { const r=Math.max(5,Math.round(DUR/5)*5), m=Math.floor(r/60), sec=r%60;
  const d=m?(m+(m>1?' minutes':' minute')+(sec?' '+sec+' seconds':'')):(sec+' seconds');
  $('startHint').innerHTML=html('About '+d+'. Press Space to pause.'); }
if(CHAPTERS.length<2) $('chapters').hidden=true;
seek.max=String(DUR*10);
$('startBtn').addEventListener('click',play);
playBtn.addEventListener('click',toggle);
$('restartBtn').addEventListener('click',()=>{seekTo(0);play();});
$('replayBtn').addEventListener('click',()=>{seekTo(0);play();});
seek.addEventListener('pointerdown',()=>{seeking=true;});
seek.addEventListener('input',()=>{hideStart();seekTo(seek.value/10);});
seek.addEventListener('change',()=>{seeking=false;});
seek.addEventListener('pointerup',()=>{seeking=false;});
$('soundBtn').addEventListener('click',()=>{ AU.init(); AU.setOn(!AU.on); const b=$('soundBtn'); b.setAttribute('aria-pressed',AU.on?'true':'false');
  b.setAttribute('aria-label',AU.on?'Sound on':'Sound off'); $('waves').style.display=AU.on?'':'none'; $('mute').toggleAttribute('hidden',AU.on); });
const fsBtn=$('fsBtn'), wrap=$('wrap');
if(!(document.fullscreenEnabled&&wrap.requestFullscreen)) fsBtn.hidden=true;
function toggleFs(){ if(document.fullscreenElement) document.exitFullscreen(); else if(wrap.requestFullscreen) wrap.requestFullscreen().catch(()=>{}); }
fsBtn.addEventListener('click',toggleFs);

const chapNav=$('chapters');
const chapBtns=CHAPTERS.map(([label,ct])=>{ const b=document.createElement('button'); b.className='chap'; b.type='button'; b.innerHTML=html(label);
  b.addEventListener('click',()=>{hideStart();seekTo(ct+0.01);}); chapNav.appendChild(b); return b; });

document.addEventListener('keydown',e=>{
  const tg=(e.target&&e.target.tagName)||''; const onCtl=tg==='BUTTON'||tg==='INPUT'||tg==='A';
  if(e.code==='Space'&&!onCtl){e.preventDefault();toggle();}
  else if((e.key==='f'||e.key==='F')&&!e.metaKey&&!e.ctrlKey){toggleFs();}
  else if(e.key==='ArrowRight'&&tg!=='INPUT'){hideStart();seekTo(t+5);}
  else if(e.key==='ArrowLeft'&&tg!=='INPUT'){hideStart();seekTo(t-5);}
});

if(document.fonts){
  ['40px "Press Start 2P"','40px "Pixelify Sans"','600 40px "Pixelify Sans"'].forEach(f=>document.fonts.load(f).catch(()=>{}));
  document.fonts.ready.then(()=>{ lastCue=-1; lastKey=''; });
}
requestAnimationFrame(frame);
})();
</script>
